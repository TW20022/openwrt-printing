name: Build CUPS Single Package (Airoha AN7581)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gawk flex git wget unzip python3 zstd

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64 openwrt-sdk

    - name: Configure feeds
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        # 引入第三方打印包源
        echo "src-git printing https://github.com/woniuzfb/openwrt-24-printing-packages.git" >> feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install cups

        # 配置架构环境
        cat > .config <<'EOF'
        CONFIG_TARGET_airoha=y
        CONFIG_TARGET_airoha_an7581=y
        CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y
        # 强制将 cups 设为模块编译
        CONFIG_PACKAGE_cups=m
        EOF
        
        make defconfig

    - name: Pre-download Precompiled Dependencies (Trick)
      run: |
        cd openwrt-sdk
        # 【修正点】目录名变更为 aarch64_generic
        mkdir -p bin/packages/aarch64_generic/base bin/packages/aarch64_generic/packages
        
        # 直接去官方 aarch64_generic 目录下载预编译好的依赖包（zlib、libpng、gdbm）
        BASE_URL="https://downloads.openwrt.org/snapshots/packages/aarch64_generic"
        
        wget -q "$BASE_URL/base/Packages.gz" -O Packages_base.gz
        wget -q "$BASE_URL/packages/Packages.gz" -O Packages_pkgs.gz
        
        zcat Packages_base.gz > Packages_base
        zcat Packages_pkgs.gz > Packages_pkgs
        
        ZLIB_FILE=$(grep -o 'Filename: zlib_.*\.ipk' Packages_base | head -n 1 | cut -d' ' -f2)
        LIBPNG_FILE=$(grep -o 'Filename: libpng_.*\.ipk' Packages_pkgs | head -n 1 | cut -d' ' -f2)
        GDBM_FILE=$(grep -o 'Filename: gdbm_.*\.ipk' Packages_pkgs | head -n 1 | cut -d' ' -f2)
        
        wget -q -P bin/packages/aarch64_generic/base/ "$BASE_URL/base/$ZLIB_FILE"
        wget -q -P bin/packages/aarch64_generic/packages/ "$BASE_URL/packages/$LIBPNG_FILE"
        wget -q -P bin/packages/aarch64_generic/packages/ "$BASE_URL/packages/$GDBM_FILE"
        echo "=== 官方依赖包伪装完成 ==="

    - name: Build CUPS Only
      run: |
        cd openwrt-sdk
        echo "=== 开始精准编译 CUPS ==="
        # 仅编译 cups 本体，不加全局干扰
        make package/feeds/printing/cups/compile -j$(nproc) V=s || echo "编译失败"

    - name: Collect IPK Files
      run: |
        cd openwrt-sdk
        mkdir -p ../output_ipks
        # 把刚编好的 cups 和刚才下载的依赖拷贝到一起
        find bin/packages/ -type f -name "*.ipk" -exec cp {} ../output_ipks/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XG-040G-MD-CUPS-Pack
        path: output_ipks/*.ipk
