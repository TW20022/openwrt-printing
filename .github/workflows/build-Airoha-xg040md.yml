name: Build CUPS Single Package (Airoha AN7581)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gawk flex git wget unzip python3 zstd

    - name: Download and extract SDK
      run: |
        TARGET_URL="https://downloads.openwrt.org/snapshots/targets/airoha/an7581/"
        echo "=== 正在获取官方最新完整的 SDK 文件名 ==="
        
        SDK_NAME=$(wget -qO- "$TARGET_URL" | grep -o 'openwrt-sdk-airoha-an7581_[^"]*\.tar\.zst' | head -n 1)
        
        if [ -z "$SDK_NAME" ]; then
          echo "❌ 未能从官方页面抓取到有效的 SDK 文件名！"
          exit 1
        fi
        
        echo "最新 SDK 文件名: $SDK_NAME"
        wget -c "$TARGET_URL$SDK_NAME"
        
        echo "=== 开始解压 ==="
        tar -xf "$SDK_NAME"
        mv openwrt-sdk-airoha-an7581_* openwrt-sdk

    - name: Configure feeds
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        echo "src-git printing https://github.com/woniuzfb/openwrt-24-printing-packages.git" >> feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install cups

        cat > .config <<'EOF'
        CONFIG_TARGET_airoha=y
        CONFIG_TARGET_airoha_an7581=y
        CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y
        CONFIG_PACKAGE_cups=m
        EOF
        
        make defconfig

    - name: Pre-download Precompiled Dependencies (Dual-Path Fix)
      run: |
        cd openwrt-sdk
        
        # 1. 声明真正有文件的官方基础 URL (cortex-a53)
        BASE_URL="https://downloads.openwrt.org/snapshots/packages/aarch64_cortex-a53"
        
        # 2. 下载并解压真实的包索引文件
        wget -q "$BASE_URL/base/Packages.gz" -O Packages_base.gz
        wget -q "$BASE_URL/packages/Packages.gz" -O Packages_pkgs.gz
        zcat Packages_base.gz > Packages_base
        zcat Packages_pkgs.gz > Packages_pkgs
        
        # 3. 提取真实的 ipk 文件名
        ZLIB_FILE=$(grep -o 'Filename: zlib_.*\.ipk' Packages_base | head -n 1 | cut -d' ' -f2)
        LIBPNG_FILE=$(grep -o 'Filename: libpng_.*\.ipk' Packages_pkgs | head -n 1 | cut -d' ' -f2)
        GDBM_FILE=$(grep -o 'Filename: gdbm_.*\.ipk' Packages_pkgs | head -n 1 | cut -d' ' -f2)
        
        # 4. 【双保险核心】：同时为 aarch64_generic 和 aarch64_cortex-a53 创建本地物理目录
        # 这样无论 SDK 内部逻辑往哪个文件夹里找依赖，都能精准命中，不会触发工具链大编译
        mkdir -p bin/packages/aarch64_generic/base bin/packages/aarch64_generic/packages
        mkdir -p bin/packages/aarch64_cortex-a53/base bin/packages/aarch64_cortex-a53/packages
        
        echo ">>> 正在下载 zlib..."
        wget -q "$BASE_URL/base/$ZLIB_FILE"
        cp "$ZLIB_FILE" bin/packages/aarch64_generic/base/
        cp "$ZLIB_FILE" bin/packages/aarch64_cortex-a53/base/
        
        echo ">>> 正在下载 libpng..."
        wget -q "$BASE_URL/packages/$LIBPNG_FILE"
        cp "$LIBPNG_FILE" bin/packages/aarch64_generic/packages/
        cp "$LIBPNG_FILE" bin/packages/aarch64_cortex-a53/packages/
        
        echo ">>> 正在下载 gdbm..."
        wget -q "$BASE_URL/packages/$GDBM_FILE"
        cp "$GDBM_FILE" bin/packages/aarch64_generic/packages/
        cp "$GDBM_FILE" bin/packages/aarch64_cortex-a53/packages/
        
        echo "=== 官方依赖包多路径伪装完美完成 ==="

    - name: Build CUPS Only
      run: |
        cd openwrt-sdk
        echo "=== 开始精准编译 CUPS ==="
        make package/feeds/printing/cups/compile -j$(nproc) V=s || echo "编译失败"

    - name: Collect IPK Files
      run: |
        cd openwrt-sdk
        mkdir -p ../output_ipks
        find bin/packages/ -type f -name "*.ipk" -exec cp {} ../output_ipks/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XG-040G-MD-CUPS-Pack
        path: output_ipks/*.ipk
