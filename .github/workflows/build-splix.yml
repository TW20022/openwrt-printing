name: Build SpliX Driver Only

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-splix.yml'

jobs:
  build-splix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt7621/openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk
        rm -f *.zst

    - name: Configure feeds and target
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        echo "src-git printing https://github.com/TW20022/openwrt-printing-packages.git" >> feeds.conf

        ./scripts/feeds update -a
        # 注意：这里安装 printing feed 下的所有包，必须加 -a，确保 libcups 等依赖被真正软链接
        ./scripts/feeds install -a

        cat > .config <<'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_PACKAGE_libcups=y
        CONFIG_PACKAGE_libcupsimage=y
        CONFIG_PACKAGE_libjbigkit=y
        CONFIG_PACKAGE_splix=y
        EOF

        make defconfig

    - name: Compile SpliX and Dependencies
      run: |
        cd openwrt-sdk
        # 直接编译 splix。OpenWrt SDK 的包编译会自动处理好 libcups、libjbigkit 等前置依赖，
        # 不需要手动一行行去 make 每一个底层库。
        make V=s -j1

    - name: Upload SpliX IPK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mt7621-splix-ipk
        path: openwrt-sdk/bin/packages/mipsel_24kc/printing/splix*.ipk
