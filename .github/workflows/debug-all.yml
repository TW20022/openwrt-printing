name: Build ImmortalWrt IPK
on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Target Arch"
        type: choice
        required: true
        default: qualcommax
        options:
          - qualcommax
          - airoha
          - mediatek
          - armsr
          - ramips
          - x86
      target_subtarget:
        description: "SubTarget (需要和Arch匹配，x86填64)"
        type: choice
        required: true
        default: ipq807x
        options:
          - ipq807x
          - ipq50xx
          - ipq60xx
          - an7581
          - an7583
          - filogic
          - armv8
          - armv7
          - mt7621
          - 64
      immortalwrt_version:
        description: "ImmortalWrt版本"
        required: true
        default: "24.10.4"
        type: string
      gcc_version:
        description: "GCC版本"
        required: true
        default: "13.3.0"
        type: string
      libc:
        description: "libc"
        required: true
        default: "musl"
        type: choice
        options:
          - musl
          - glibc
      custom_feed_repo:
        description: "自定义feed仓库git地址"
        required: true
        default: "https://github.com/TW20022/openwrt-24-printing-packages.git"
        type: string
      custom_feed_name:
        description: "feed名称"
        required: true
        default: "printing"
        type: string
      target_packages_str:
        description: "待编译包，空格分隔；留空=编译feed全部包"
        required: false
        default: ""
        type: string
      max_jobs:
        description: "全局编译并发数(数字，GitHub免费runner建议2-4)"
        required: true
        default: "4"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET_COMBO: ${{ github.event.inputs.target_arch }}:${{ github.event.inputs.target_subtarget }}
      IMMORTALWRT_VERSION: ${{ github.event.inputs.immortalwrt_version }}
      GCC_VERSION: ${{ github.event.inputs.gcc_version }}
      LIBC: ${{ github.event.inputs.libc }}
      CUSTOM_FEED_REPO: ${{ github.event.inputs.custom_feed_repo }}
      CUSTOM_FEED_NAME: ${{ github.event.inputs.custom_feed_name }}
      TARGET_PACKAGES_STR: ${{ github.event.inputs.target_packages_str }}
      MAX_JOBS: ${{ github.event.inputs.max_jobs }}
      CI: "true"
      WORKDIR: ${{ github.workspace }}/immortalwrt_build
      OUTPUT_DIR: ${{ github.workspace }}/ipk_output
      LOG_DIR: ${{ github.workspace }}/immortalwrt_build/build_logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -uo pipefail
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip libelf-dev \
            python3 python3-distutils python3-setuptools python3-dev perl zstd rsync ca-certificates file time diffutils subversion mercurial \
            patchelf libgmp-dev libmpc-dev libxml2-utils libmpfr-dev libsane-dev libsnmp-dev ghostscript
          # 全局配置git安全目录，避免feeds拉取的仓库报错
          git config --global --add safe.directory '*'

      - name: Cache SDK tarball & dl
        uses: actions/cache@v4
        with:
          path: |
            ./immortalwrt_build/*.tar.zst
            ./immortalwrt_build/dl
          # 缓存key包含所有影响SDK包的参数，避免不同配置复用错误缓存
          key: ${{ env.IMMORTALWRT_VERSION }}-${{ env.TARGET_COMBO }}-gcc-${{ env.GCC_VERSION }}-${{ env.LIBC }}-sdk-dl

      - name: Run full build logic
        run: |
          set -uo pipefail

          # 校验MAX_JOBS为数字
          if ! [[ "${MAX_JOBS}" =~ ^[0-9]+$ ]]; then
            echo "::error::max_jobs必须为数字"
            exit 1
          fi
          if (( MAX_JOBS < 1 || MAX_JOBS > 32 )); then
            echo "::error::max_jobs范围为1-32，免费runner建议2-4"
            exit 1
          fi

          # 解析 target_combo
          TARGET_ARCH="${TARGET_COMBO%%:*}"
          TARGET_SUBTARGET="${TARGET_COMBO#*:}"
          if [[ "${TARGET_ARCH}" == "${TARGET_SUBTARGET}" ]]; then
            echo "::error::TARGET_COMBO格式错误 ${TARGET_COMBO}"
            exit 1
          fi

          # 校验Arch与SubTarget匹配关系，避免SDK下载404
          declare -A VALID_SUBTARGETS=(
            [qualcommax]="ipq807x ipq50xx ipq60xx"
            [airoha]="an7581 an7583"
            [mediatek]="filogic"
            [armsr]="armv8 armv7"
            [ramips]="mt7621"
            [x86]="64"
          )
          if [[ ! " ${VALID_SUBTARGETS[${TARGET_ARCH}]} " =~ " ${TARGET_SUBTARGET} " ]]; then
            echo "::error::${TARGET_SUBTARGET} 不是 ${TARGET_ARCH} 的合法子目标，可选值: ${VALID_SUBTARGETS[${TARGET_ARCH}]}"
            exit 1
          fi

          echo "✅ Target validated: ${TARGET_ARCH}/${TARGET_SUBTARGET}"
          echo "✅ ImmortalWrt: ${IMMORTALWRT_VERSION}, GCC: ${GCC_VERSION}, libc: ${LIBC}"

          # 导出artifact用的后缀名，避免表达式里用不支持的replace函数
          ARTIFACT_SUFFIX="${TARGET_ARCH}-${TARGET_SUBTARGET}"
          echo "ARTIFACT_SUFFIX=${ARTIFACT_SUFFIX}" >> "$GITHUB_ENV"

          SDK_DIR="${WORKDIR}/sdk-${TARGET_ARCH}-${TARGET_SUBTARGET}"
          mkdir -p "${WORKDIR}"

          sdk_tarname="immortalwrt-sdk-${IMMORTALWRT_VERSION}-${TARGET_ARCH}-${TARGET_SUBTARGET}_gcc-${GCC_VERSION}_${LIBC}.Linux-x86_64.tar.zst"
          sdk_url="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET_ARCH}/${TARGET_SUBTARGET}/${sdk_tarname}"

          # 下载SDK，增加超时和重试
          if [[ ! -f "${WORKDIR}/${sdk_tarname}" ]]; then
            echo "[INFO] Downloading SDK from ${sdk_url}"
            wget --tries=5 --timeout=60 --dns-timeout=15 --no-verbose -P "${WORKDIR}" "${sdk_url}" || { echo "::error::SDK download failed, please check version/arch/subtarget combination exists"; exit 1; }
          else
            echo "[INFO] SDK archive exists in cache, reusing: ${sdk_tarname}"
          fi

          # 校验SDK包大小，避免下载到404错误页
          tar_size=$(stat -c%s "${WORKDIR}/${sdk_tarname}")
          if [[ $tar_size -lt 10000000 ]]; then # 小于10M肯定是错误文件
            echo "::error::SDK file size too small (${tar_size} bytes), probably corrupted or 404"
            rm -f "${WORKDIR}/${sdk_tarname}"
            exit 1
          fi

          # 解压SDK（缓存只存tar包，每次重新解压保证环境干净）
          echo "[INFO] Extracting SDK..."
          temp_extract_dir="${WORKDIR}/temp_extract_${RANDOM}"
          mkdir -p "${temp_extract_dir}"
          if tar --zstd -xf "${WORKDIR}/${sdk_tarname}" -C "${temp_extract_dir}" 2>/dev/null; then
            :
          else
            tar -I zstd -xf "${WORKDIR}/${sdk_tarname}" -C "${temp_extract_dir}" || { echo "::error::SDK extract failed, file corrupted"; exit 1; }
          fi

          shopt -s nullglob
          extracted_files=( "${temp_extract_dir}"/* )
          shopt -u nullglob

          if [[ ${#extracted_files[@]} -ne 1 ]];then
            echo "::error::SDK extract bad file count: ${#extracted_files[@]}"
            exit 1
          fi
          extracted_name=$(basename "${extracted_files[0]}")
          rm -rf "${SDK_DIR}"
          mv "${temp_extract_dir}/${extracted_name}" "${SDK_DIR}"
          rm -rf "${temp_extract_dir}"
          echo "[INFO] SDK extracted to ${SDK_DIR}"

          cd "${SDK_DIR}" || { echo "::error::Enter SDK directory failed"; exit 1; }

          # 初始化目录
          mkdir -p "${LOG_DIR}" "${WORKDIR}/dl"
          rm -rf "${SDK_DIR}/dl"
          ln -s "${WORKDIR}/dl" "${SDK_DIR}/dl"
          rm -rf "${OUTPUT_DIR}"
          mkdir -p "${OUTPUT_DIR}"
          rm -rf bin

          # 添加自定义feed，避免重复添加
          FEED_CONF=""
          if [[ -f feeds.conf ]]; then
            FEED_CONF="feeds.conf"
          else
            FEED_CONF="feeds.conf.default"
          fi
          if ! grep -E "^src-git[[:space:]]+${CUSTOM_FEED_NAME}[[:space:]]" "${FEED_CONF}"; then
            echo "[INFO] Adding custom feed ${CUSTOM_FEED_NAME}: ${CUSTOM_FEED_REPO}"
            echo "src-git ${CUSTOM_FEED_NAME} ${CUSTOM_FEED_REPO}" >> "${FEED_CONF}"
          fi

          # 更新feeds
          echo "[INFO] Updating feeds..."
          ./scripts/feeds update -a 2>&1 | tee "${LOG_DIR}/feeds_update.log" || { echo "::error::feeds update failed, check network or feed repo URL"; exit 1; }

          # 仅当自定义feed提供hplip时才移除官方版本，避免冲突
          if [[ -d "feeds/${CUSTOM_FEED_NAME}/utils/hplip" ]] && [[ -d feeds/packages/utils/hplip ]]; then
            echo "[INFO] Custom feed provides hplip, removing official version to avoid conflict"
            rm -rf feeds/packages/utils/hplip
          fi

          # 解析包列表
          read -ra TARGET_PACKAGES <<< "${TARGET_PACKAGES_STR}"
          if [[ ${#TARGET_PACKAGES[@]} -eq 0 ]]; then
            echo "[INFO] No packages specified, will compile ALL packages from custom feed: ${CUSTOM_FEED_NAME}"
            mapfile -t TARGET_PACKAGES < <(./scripts/feeds list -r "${CUSTOM_FEED_NAME}" | awk '$1!="TARGET:" && NF {print $1}')
            if [[ ${#TARGET_PACKAGES[@]} -eq 0 ]]; then
              echo "::error::Failed to get package list from feed ${CUSTOM_FEED_NAME}"
              exit 1
            fi
          fi
          echo "[INFO] Total target packages to build: ${#TARGET_PACKAGES[@]}"
          for p in "${TARGET_PACKAGES[@]}"; do echo "  - $p"; done

          # 安装自定义feed的包，-f强制覆盖官方同名包
          echo "[INFO] Installing feed packages (force override official packages with same name)"
          ./scripts/feeds install -p "${CUSTOM_FEED_NAME}" -f "${TARGET_PACKAGES[@]}" 2>&1 | tee "${LOG_DIR}/feeds_install.log" || { echo "::error::feeds install failed"; exit 1; }

          # 生成默认配置
          echo "[INFO] Generating default config..."
          make defconfig > "${LOG_DIR}/defconfig1.log" 2>&1

          # 标记所有目标包为模块编译，禁用文档/示例减少错误
          for pkg in "${TARGET_PACKAGES[@]}"; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=" .config 2>/dev/null; then
              sed -i "s|^CONFIG_PACKAGE_${pkg}=.*|CONFIG_PACKAGE_${pkg}=m|" .config
            else
              echo "CONFIG_PACKAGE_${pkg}=m" >> .config
            fi
            echo "CONFIG_PACKAGE_${pkg}-doc=n" >> .config
            echo "CONFIG_PACKAGE_${pkg}-examples=n" >> .config
          done

          # 重新生成配置，自动解析依赖
          make defconfig > "${LOG_DIR}/defconfig2.log" 2>&1

          # 检查包配置是否生效
          warn_cnt=0
          for pkg in "${TARGET_PACKAGES[@]}"; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=m" .config; then
              echo "[WARN] Package ${pkg} CONFIG_PACKAGE_${pkg}=m NOT set (probably missing dependencies, will be skipped)"
              warn_cnt=$((warn_cnt + 1))
            fi
          done
          if (( warn_cnt > 0 )); then
            echo "[WARN] ${warn_cnt} packages config not effective, will not be built"
          fi

          # 添加host工具和工具链目录到PATH
          export PATH="${SDK_DIR}/staging_dir/host/bin:$(echo ${SDK_DIR}/staging_dir/toolchain-*/bin):${PATH}"

          # 编译基础工具链
          echo "[INFO] Building host tools..."
          make tools/install -j"${MAX_JOBS}" V=s > "${LOG_DIR}/tools.log" 2>&1 || { echo "::error::Host tools build failed, check tools.log"; exit 1; }
          echo "[INFO] Building cross toolchain..."
          make toolchain/install -j"${MAX_JOBS}" V=s > "${LOG_DIR}/toolchain.log" 2>&1 || { echo "::error::Toolchain build failed, check toolchain.log"; exit 1; }

          # ========== 关键修复：预编译有host依赖bug的包的host版本 ==========
          # 解决gutenprint这类包编译时找不到build_dir/hostpkg下脚本的错误
          echo "[INFO] Pre-building host variants for packages with known dependency issues..."
          declare -a HOST_PKGS=("gutenprint" "cups")
          for host_pkg in "${HOST_PKGS[@]}"; do
            if ./scripts/feeds list | grep -q "^${host_pkg}$"; then
              echo "  - Building host variant of ${host_pkg}"
              if ! make "package/${host_pkg}/host/compile" -j"${MAX_JOBS}" V=s >> "${LOG_DIR}/host_pkgs.log" 2>&1; then
                echo "[WARN] Host variant of ${host_pkg} build failed, see host_pkgs.log, target package may fail"
              fi
            fi
          done

          # 下载所有源码包，重试一次
          echo "[INFO] Downloading source packages..."
          if ! make download V=s -j"${MAX_JOBS}" 2>&1 | tee "${LOG_DIR}/download.log"; then
            echo "[WARN] First download attempt failed, retrying once..."
            if ! make download V=s -j"${MAX_JOBS}" 2>&1 | tee "${LOG_DIR}/download_retry.log"; then
              echo "::error::Source download failed after retry, check download logs"
              exit 1
            fi
            echo "[INFO] Download retry succeeded"
          fi

          # 开始编译：使用-k参数实现单包失败不中断，自动处理依赖关系（比手动逐包编译可靠）
          echo "[INFO] Starting package compilation (keep-going on error, auto-resolve dependencies)..."
          BUILD_RC=0
          if ! make -k -j"${MAX_JOBS}" V=s 2>&1 | tee "${LOG_DIR}/build.log"; then
            BUILD_RC=$?
            echo "[WARN] Build completed with errors (rc=${BUILD_RC}), check build.log for details"
          fi

          # 清空输出目录，准备收集产物
          find "${OUTPUT_DIR}" -mindepth 1 -delete 2>/dev/null || true

          # 收集所有生成的ipk（包括packages和targets目录，避免漏掉内核模块）
          echo "[INFO] Collecting generated IPK packages..."
          if [[ -d bin/packages ]]; then
            find bin/packages -type f -name "*.ipk" -exec cp -v {} "${OUTPUT_DIR}/" \; | tee "${LOG_DIR}/collect.log"
          fi
          if [[ -d bin/targets ]]; then
            find bin/targets -type f -name "*.ipk" -exec cp -v {} "${OUTPUT_DIR}/" \; | tee -a "${LOG_DIR}/collect.log"
          fi

          # 统计成功/失败的包：根据OUTPUT_DIR中是否存在对应ipk判断
          success_list=()
          failed_list=()
          for pkg in "${TARGET_PACKAGES[@]}"; do
            if ls "${OUTPUT_DIR}"/${pkg}_*.ipk 1>/dev/null 2>&1; then
              success_list+=("${pkg}")
            else
              failed_list+=("${pkg}")
            fi
          done

          # 生成构建报告
          echo ""
          echo "==== Build Summary ===="
          echo "ImmortalWrt Version: ${IMMORTALWRT_VERSION}"
          echo "Target: ${TARGET_COMBO}"
          echo "GCC: ${GCC_VERSION}, libc: ${LIBC}"
          echo "Total packages: ${#TARGET_PACKAGES[@]}"
          echo "Success: ${#success_list[@]}"
          echo "Failed/skipped: ${#failed_list[@]}"

          report_file="${OUTPUT_DIR}/build_report.txt"
          {
            echo "==================== ImmortalWrt IPK Build Report ===================="
            echo "Build time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "ImmortalWrt Version: ${IMMORTALWRT_VERSION}"
            echo "Target: ${TARGET_ARCH}/${TARGET_SUBTARGET}"
            echo "GCC Version: ${GCC_VERSION}"
            echo "libc: ${LIBC}"
            echo "Custom feed: ${CUSTOM_FEED_NAME} - ${CUSTOM_FEED_REPO}"
            echo "======================================================================="
            echo ""
            echo "Total requested packages: ${#TARGET_PACKAGES[@]}"
            echo "Successfully built: ${#success_list[@]}"
            echo "Failed/skipped: ${#failed_list[@]}"
            echo ""
            echo "-------------------------- Success packages --------------------------"
            if [[ ${#success_list[@]} -eq 0 ]]; then
              echo "  (none)"
            else
              for p in "${success_list[@]}"; do echo "  ✅ $p"; done
            fi
            echo ""
            echo "-------------------------- Failed packages ---------------------------"
            if [[ ${#failed_list[@]} -eq 0 ]]; then
              echo "  (none) 🎉 All packages built successfully!"
            else
              for p in "${failed_list[@]}"; do echo "  ❌ $p"; done
            fi
            echo ""
            echo "-------------------------- Generated files ---------------------------"
            ls -1 "${OUTPUT_DIR}"/*.ipk 2>/dev/null | xargs -I{} basename {} || echo "  (no ipk generated)"
          } > "${report_file}"

          echo "[INFO] IPK output directory: ${OUTPUT_DIR}"
          echo "[INFO] Generated files count: $(ls -1 "${OUTPUT_DIR}"/*.ipk 2>/dev/null | wc -l)"

          # 存在失败包时输出CI警告，默认不标记job失败
          if [[ ${#failed_list[@]} -gt 0 ]]; then
            echo "::warning::${#failed_list[@]} 个软件包编译失败或跳过，请查看artifact中的build_report.txt和日志定位问题"
            # 取消下面注释可让有失败包时job直接标红
            # exit 1
          fi

      # 所有上传步骤加if: always()，确保即使构建失败也能拿到日志和已生成的ipk
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.LOG_DIR }}
          retention-days: 14

      - name: Upload ipk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 30
