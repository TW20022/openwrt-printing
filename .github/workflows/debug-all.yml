name: Build ImmortalWrt IPK
on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Target Arch"
        type: choice
        required: true
        default: qualcommax
        options:
          - qualcommax
          - airoha
          - mediatek
          - armsr
          - ramips
          - x86
      target_subtarget:
        description: "SubTarget (需要和Arch匹配，x86填64)"
        type: choice
        required: true
        default: ipq807x
        options:
          - ipq807x
          - ipq50xx
          - ipq60xx
          - an7581
          - an7583
          - filogic
          - armv8
          - armv7
          - mt7621
          - 64
      immortalwrt_version:
        description: "ImmortalWrt版本"
        required: true
        default: "24.10.4"
        type: string
      gcc_version:
        description: "GCC版本"
        required: true
        default: "13.3.0"
        type: string
      libc:
        description: "libc"
        required: true
        default: "musl"
        type: string
      custom_feed_repo:
        description: "自定义feed仓库git地址"
        required: true
        default: "https://github.com/TW20022/openwrt-24-printing-packages.git"
        type: string
      custom_feed_name:
        description: "feed名称"
        required: true
        default: "printing"
        type: string
      target_packages_str:
        description: "待编译包，空格分隔；留空=编译feed全部包"
        required: false
        default: ""
        type: string
      max_jobs:
        description: "全局下载并发数(数字)"
        required: true
        default: "16"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET_COMBO: ${{ github.event.inputs.target_arch }}:${{ github.event.inputs.target_subtarget }}
      IMMORTALWRT_VERSION: ${{ github.event.inputs.immortalwrt_version }}
      GCC_VERSION: ${{ github.event.inputs.gcc_version }}
      LIBC: ${{ github.event.inputs.libc }}
      CUSTOM_FEED_REPO: ${{ github.event.inputs.custom_feed_repo }}
      CUSTOM_FEED_NAME: ${{ github.event.inputs.custom_feed_name }}
      TARGET_PACKAGES_STR: ${{ github.event.inputs.target_packages_str }}
      MAX_JOBS: ${{ github.event.inputs.max_jobs }}
      CI: "true"
      WORKDIR: ${{ github.workspace }}/immortalwrt_build
      OUTPUT_DIR: ${{ github.workspace }}/ipk_output
      LOG_DIR: ${{ github.workspace }}/immortalwrt_build/build_logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -uo pipefail
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip libelf-dev \
            python3 python3-distutils python3-setuptools python3-dev perl zstd rsync ca-certificates file time diffutils subversion mercurial \
            patchelf libgmp-dev libmpc-dev libxml2-utils libmpfr-dev libsane-dev libsnmp-dev ghostscript
          git config --local --add safe.directory '*'

      - name: Cache SDK tarball & dl
        uses: actions/cache@v4
        with:
          path: |
            ./immortalwrt_build/*.tar.zst
            ./immortalwrt_build/dl
          key: ${{ env.IMMORTALWRT_VERSION }}-${{ env.TARGET_COMBO }}-sdk-dl

      - name: Run full build logic inline
        run: |
          set -uo pipefail

          # 校验MAX_JOBS为数字
          if ! [[ "${MAX_JOBS}" =~ ^[0-9]+$ ]]; then
            echo "::error::max_jobs必须为数字"
            exit 1
          fi

          # 解析 target_combo
          TARGET_ARCH="${TARGET_COMBO%%:*}"
          TARGET_SUBTARGET="${TARGET_COMBO#*:}"
          if [[ "${TARGET_ARCH}" == "${TARGET_SUBTARGET}" ]]; then
            echo "::error::TARGET_COMBO格式错误 ${TARGET_COMBO}"
            exit 1
          fi
          echo "TARGET_ARCH=${TARGET_ARCH}"
          echo "TARGET_SUBTARGET=${TARGET_SUBTARGET}"

          SDK_DIR="${WORKDIR}/sdk-${TARGET_ARCH}-${TARGET_SUBTARGET}"
          mkdir -p "${WORKDIR}" "${LOG_DIR}"

          sdk_tarname="immortalwrt-sdk-${IMMORTALWRT_VERSION}-${TARGET_ARCH}-${TARGET_SUBTARGET}_gcc-${GCC_VERSION}_${LIBC}.Linux-x86_64.tar.zst"
          sdk_url="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET_ARCH}/${TARGET_SUBTARGET}/${sdk_tarname}"

          # 下载SDK，增加重试
          if [[ ! -f "${WORKDIR}/${sdk_tarname}" ]]; then
            echo "[INFO] Download SDK ${sdk_url}"
            wget --tries=3 --no-verbose -P "${WORKDIR}" "${sdk_url}" || { echo "::error::SDK download failed"; exit 1; }
          else
            echo "[INFO] SDK archive exists, reuse cache ${sdk_tarname}"
          fi

          tar_size=$(stat -c%s "${WORKDIR}/${sdk_tarname}")
          if [[ $tar_size -lt 1000000 ]]; then
            echo "::error::SDK file too small, corrupted"
            exit 1
          fi

          # 解压SDK
          if [[ ! -d "${SDK_DIR}" ]]; then
            echo "[INFO] Extract SDK"
            temp_extract_dir="${WORKDIR}/temp_extract_${RANDOM}"
            mkdir -p "${temp_extract_dir}"
            if tar --zstd -xf "${WORKDIR}/${sdk_tarname}" -C "${temp_extract_dir}" 2>/dev/null; then
              :
            else
              tar -I zstd -xf "${WORKDIR}/${sdk_tarname}" -C "${temp_extract_dir}" || { echo "::error::SDK extract failed"; exit 1; }
            fi

            shopt -s nullglob
            extracted_files=( "${temp_extract_dir}"/* )
            shopt -u nullglob

            if [[ ${#extracted_files[@]} -ne 1 ]];then
              echo "::error::SDK extract bad count ${#extracted_files[@]}"
              exit 1
            fi
            extracted_name=$(basename "${extracted_files[0]}")
            mv "${temp_extract_dir}/${extracted_name}" "${SDK_DIR}"
            rm -rf "${temp_extract_dir}"
          else
            echo "[INFO] Reuse existing SDK dir ${SDK_DIR}"
          fi

          cd "${SDK_DIR}" || { echo "::error::cd SDK_DIR failed"; exit 1; }

          rm -rf "${LOG_DIR}"
          mkdir -p "${LOG_DIR}" "${WORKDIR}/dl"
          rm -rf "${SDK_DIR}/dl"
          ln -s "${WORKDIR}/dl" "${SDK_DIR}/dl"

          # add custom feed, avoid commented‑line match
          if ! grep -E "^src-git[[:space:]]+${CUSTOM_FEED_NAME}[[:space:]]" feeds.conf.default; then
            echo "[INFO] Add custom feed ${CUSTOM_FEED_REPO}"
            echo "src-git ${CUSTOM_FEED_NAME} ${CUSTOM_FEED_REPO}" >> feeds.conf.default
          fi

          echo "[INFO] feeds update -a"
          ./scripts/feeds update -a || { echo "::error::feeds update failed"; exit 1; }

          if [ -d feeds/packages/utils/hplip ]; then
            echo "[INFO] Remove official hplip"
            rm -rf feeds/packages/utils/hplip
          fi

          # parse package list
          read -ra TARGET_PACKAGES <<< "${TARGET_PACKAGES_STR}"
          if [[ ${#TARGET_PACKAGES[@]} -eq 0 ]]; then
            echo "[INFO] No packages input, fetch all from feed ${CUSTOM_FEED_NAME}"
            # 修复：直接进程替换，不存中间变量
            mapfile -t TARGET_PACKAGES < <(./scripts/feeds list -r "${CUSTOM_FEED_NAME}" | awk '{print $1}')
            if [[ ${#TARGET_PACKAGES[@]} -eq 0 ]]; then
              echo "::error::feeds list return zero packages"
              exit 1
            fi
          fi
          echo "[INFO] Total target packages: ${#TARGET_PACKAGES[@]}"
          for p in "${TARGET_PACKAGES[@]}"; do echo " - $p"; done

          echo "[WARN] feeds install -a -f : 将强制覆盖官方同名软件包"
          ./scripts/feeds install -p "${CUSTOM_FEED_NAME}" -a -f || { echo "::error::feeds install failed"; exit 1; }

          [[ -x ./scripts/config ]] || { echo "::error::missing ./scripts/config"; exit 1; }

          make defconfig > "${LOG_DIR}/defconfig1.log" 2>&1
          for pkg in "${TARGET_PACKAGES[@]}"; do
            ./scripts/config --set-val "CONFIG_PACKAGE_${pkg}" m
          done
          make defconfig > "${LOG_DIR}/defconfig2.log" 2>&1

          warn_cnt=0
          for pkg in "${TARGET_PACKAGES[@]}"; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=m" .config; then
              echo "[WARN] package ${pkg} CONFIG_PACKAGE_${pkg}=m NOT set"
              ((warn_cnt++))
            fi
          done
          if (( warn_cnt > 0 )); then
            echo "[WARN] ${warn_cnt} packages config not effective, build may fail"
          fi

          rm -rf bin

          echo "[INFO] make download"
          if ! make download V=s -j"${MAX_JOBS}" 2>&1 | tee "${LOG_DIR}/download.log"; then
            echo "[WARN] download failed, start retry once"
            if ! make download V=s -j"${MAX_JOBS}" 2>&1 | tee "${LOG_DIR}/download_retry.log"; then
              echo "::error::make download retry failed"
              exit 1
            fi
            echo "[INFO] download retry success"
          fi

          success_list=()
          failed_list=()
          echo "[INFO] Start per‑package compile (install mode, single fail will NOT abort job)"
          for pkg in "${TARGET_PACKAGES[@]}"; do
            echo ""
            echo "--------------------------------------------------"
            echo ">>> [START BUILD] package: ${pkg}"
            echo "--------------------------------------------------"
            pkg_log="${LOG_DIR}/pkg_${pkg}.log"
            if make "package/${pkg}/install" V=s -j1 2>&1 | tee "${pkg_log}"; then
              echo "<<< [SUCCESS] package: ${pkg}"
              success_list+=("${pkg}")
            else
              echo "[WARN] <<< [FAILED] package: ${pkg}, continue next package, log: ${pkg_log}"
              failed_list+=("${pkg}")
            fi
          done

          echo "==== Build Summary ===="
          echo "ImmortalWrt Version: ${IMMORTALWRT_VERSION}"
          echo "Target: ${TARGET_COMBO}"
          echo "Total: ${#TARGET_PACKAGES[@]}"
          echo "Success: ${#success_list[@]}"
          echo "Failed: ${#failed_list[@]}"

          mkdir -p "${OUTPUT_DIR}"
          report_file="${OUTPUT_DIR}/build_report.txt"
          {
            echo "ImmortalWrt Build Report"
            echo "Version: ${IMMORTALWRT_VERSION}"
            echo "Target: ${TARGET_COMBO}"
            echo "Total: ${#TARGET_PACKAGES[@]}"
            echo "Success: ${#success_list[@]}"
            echo "Failed: ${#failed_list[@]}"
            echo ""
            echo "Success packages:"
            for p in "${success_list[@]}"; do echo "  - $p"; done
            echo ""
            echo "Failed packages:"
            for p in "${failed_list[@]}"; do echo "  - $p"; done
          } > "${report_file}"

          # collect ipk
          if [[ -d "${OUTPUT_DIR}" ]]; then
            find "${OUTPUT_DIR}" -mindepth 1 -delete
          fi
          find bin/packages -type f -name "*.ipk" -exec cp {} "${OUTPUT_DIR}/" \;
          echo "[INFO] IPK output dir ${OUTPUT_DIR}"
          ls -1 "${OUTPUT_DIR}"/*.ipk 2>/dev/null || echo "[WARN] no ipk generated"

          # 存在失败包，输出CI页面警告，job依旧绿色
          if [[ ${#failed_list[@]} -gt 0 ]]; then
            echo "::warning::存在 ${#failed_list[@]} 个软件包编译失败，请查看artifact报告与日志"
            # 取消下面注释，有失败包job直接标红
            # exit 1
          fi

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: logs‑${{ env.TARGET_COMBO | replace(':','_') }}
          path: ${{ env.LOG_DIR }}
          retention-days: 14

      - name: Upload ipk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk‑${{ env.TARGET_COMBO | replace(':','_') }}
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 14
