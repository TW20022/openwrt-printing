name: ImmortalWrt IPK Compile WorkFlow

on:
  workflow_dispatch:
    inputs:
      target_combo:
        description: '请选择编译的目标架构与子架构组合 (Target Combo)'
        required: true
        default: 'qualcommax:ipq807x'
        type: choice
        options:
          - 'qualcommax:ipq807x'
          - 'qualcommax:ipq50xx'
          - 'qualcommax:ipq60xx'
          - 'airoha:an7581'
          - 'airoha:an7583'
          - 'mediatek:filogic'
          - 'armsr:armv8'
          - 'armsr:armv7'
          - 'ramips:mt7621'
          - 'x86:64'

env:
  IMMORTALWRT_VERSION: "24.10.5"
  GCC_VERSION: "13.3.0"
  LIBC: "musl"
  CUSTOM_FEED_REPO: "https://github.com/TW20022/openwrt-24-printing-packages.git"
  CUSTOM_FEED_NAME: "printing"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          # 【修复核心】补全编译 Kconfig 必需的 flex 和 bison 工具
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            libncurses-dev libncursesw5-dev zlib1g-dev \
            git gettext libssl-dev xsltproc wget unzip libelf-dev \
            python3 python3-setuptools python3-dev perl zstd rsync ca-certificates file \
            time diffutils subversion mercurial patchelf libgmp-dev libmpc-dev libxml2-utils libmpfr-dev libsane-dev libsnmp-dev ghostscript

      - name: Prepare Build Environment & SDK
        run: |
          TARGET_COMBO="${{ github.event.inputs.target_combo }}"
          TARGET_ARCH="${TARGET_COMBO%%:*}"
          TARGET_SUBTARGET="${TARGET_COMBO#*:}"
          
          WORKDIR="${{ github.workspace }}/immortalwrt_build"
          SDK_DIR="${WORKDIR}/sdk-${TARGET_ARCH}-${TARGET_SUBTARGET}"
          OUTPUT_DIR="${{ github.workspace }}/ipk_output"

          echo "TARGET_ARCH=${TARGET_ARCH}" >> $GITHUB_ENV
          echo "TARGET_SUBTARGET=${TARGET_SUBTARGET}" >> $GITHUB_ENV
          echo "WORKDIR=${WORKDIR}" >> $GITHUB_ENV
          echo "SDK_DIR=${SDK_DIR}" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> $GITHUB_ENV

          mkdir -p "${WORKDIR}"
          SDK_TARNAME="immortalwrt-sdk-${IMMORTALWRT_VERSION}-${TARGET_ARCH}-${TARGET_SUBTARGET}_gcc-${GCC_VERSION}_${LIBC}.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET_ARCH}/${TARGET_SUBTARGET}/${SDK_TARNAME}"

          echo "[INFO] 检查并下载 SDK: ${SDK_URL}"
          if [ ! -f "${WORKDIR}/${SDK_TARNAME}" ]; then
            wget -P "${WORKDIR}" "${SDK_URL}" || { echo "[FATAL] SDK 下载失败"; exit 1; }
          fi

          if [ ! -d "${SDK_DIR}" ]; then
            echo "[INFO] 解压 SDK..."
            TEMP_DIR="${WORKDIR}/temp_extract_$((RANDOM))"
            mkdir -p "${TEMP_DIR}"
            tar --zstd -xf "${WORKDIR}/${SDK_TARNAME}" -C "${TEMP_DIR}"
            EXTRACTED_NAME=$(ls "${TEMP_DIR}" | head -n1)
            mv "${TEMP_DIR}/${EXTRACTED_NAME}" "${SDK_DIR}"
            rm -rf "${TEMP_DIR}"
          fi

      - name: Add Custom Feed and Configure Packages
        run: |
          cd "${SDK_DIR}"
          
          mkdir -p "${WORKDIR}/dl"
          rm -rf dl
          ln -s "${WORKDIR}/dl" dl

          if ! grep -q "${CUSTOM_FEED_NAME}" feeds.conf.default; then
            echo "src-git ${CUSTOM_FEED_NAME} ${CUSTOM_FEED_REPO}" >> feeds.conf.default
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          if [ -d feeds/packages/utils/hplip ]; then
            echo "[INFO] 移除官方 hplip"
            rm -rf feeds/packages/utils/hplip
          fi

          # 自动获取第三方仓库中的所有包
          mapfile -t TARGET_PACKAGES < <(./scripts/feeds list -r "${CUSTOM_FEED_NAME}" | awk '{print $1}')
          
          if [ ${#TARGET_PACKAGES[@]} -eq 0 ]; then
            echo "[FATAL] 未能获取到任何包" && exit 1
          fi

          echo "[INFO] 已成功锁定 ${#TARGET_PACKAGES[@]} 个编译目标包。"
          
          echo "TARGET_PACKAGES_STR=${TARGET_PACKAGES[*]}" >> $GITHUB_ENV

          # 运行 defconfig，如果失败则自动打印详细日志用于排查
          make defconfig || {
            echo "[ERROR] make defconfig 失败，正在输出详细日志..."
            make defconfig -j1 V=s
            exit 1
          }

          for pkg in "${TARGET_PACKAGES[@]}"; do
            echo "CONFIG_PACKAGE_${pkg}=m" >> .config
          done

          make defconfig || {
            echo "[ERROR] 二次 make defconfig 失败，正在输出详细日志..."
            make defconfig -j1 V=s
            exit 1
          }

      - name: Compile Packages
        run: |
          cd "${SDK_DIR}"
          JOBS=$(nproc)
          
          read -r -a TARGET_PACKAGES <<< "${TARGET_PACKAGES_STR}"

          echo "=================================================="
          echo " 准备开始编译，本次共有 ${#TARGET_PACKAGES[@]} 个软件包待编译："
          echo "=================================================="
          for i in "${!TARGET_PACKAGES[@]}"; do
            echo "  $((i+1)). ${TARGET_PACKAGES[$i]}"
          done
          echo "=================================================="

          echo "[INFO] 开始下载所有目标包及其依赖的源码..."
          make download -j"${JOBS}" || make download -j"${JOBS}"

          SUCCESS_LIST=()
          FAILED_LIST=()

          set +e

          for pkg in "${TARGET_PACKAGES[@]}"; do
            echo ""
            echo "--------------------------------------------------"
            echo ">>> [开始编译] 软件包: ${pkg}"
            echo "--------------------------------------------------"

            make "package/${pkg}/compile" -j"${JOBS}" > "build_${pkg}.log" 2>&1
            BUILD_STATUS=$?

            if [ ${BUILD_STATUS} -eq 0 ]; then
              echo "<<< [编译成功] 软件包: ${pkg}"
              SUCCESS_LIST+=("${pkg}")
            else
              echo "<<< [编译失败] 软件包: ${pkg} 编译出错，跳过并继续下一个..."
              echo "--- 错误日志摘要 (${pkg}) ---"
              tail -n 20 "build_${pkg}.log"
              echo "----------------------------"
              FAILED_LIST+=("${pkg}")
            fi
          done

          set -e

          echo ""
          echo "=================================================="
          echo "                 编译任务全部完成                 "
          echo "=================================================="
          echo "总计包数量 : ${#TARGET_PACKAGES[@]}"
          echo "成功数量   : ${#SUCCESS_LIST[@]}"
          echo "失败数量   : ${#FAILED_LIST[@]}"
          
          if [ ${#SUCCESS_LIST[@]} -gt 0 ]; then
            echo "【成功列表】"
            for s_pkg in "${SUCCESS_LIST[@]}"; do
              echo "  - ${s_pkg}"
            done
          fi

          if [ ${#FAILED_LIST[@]} -gt 0 ]; then
            echo "【失败列表】"
            for f_pkg in "${FAILED_LIST[@]}"; do
              echo "  - ${f_pkg}"
            done
          fi
          echo "=================================================="

      - name: Collect IPKs
        run: |
          cd "${SDK_DIR}"
          mkdir -p "${OUTPUT_DIR}"
          find bin/packages -type f -name "*.ipk" -exec cp -v {} "${OUTPUT_DIR}/" \;
          echo "================= IPK 收集完成 ================="
          ls -lh "${OUTPUT_DIR}"/*.ipk 2>/dev/null || echo "[WARN] 未找到 ipk 文件"

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-packages-${{ github.event.inputs.target_combo }}
          path: ${{ github.workspace }}/ipk_output/*.ipk
