name: Build Custom ImmortalWrt IPK

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: 'ImmortalWrt 版本号'
        required: true
        default: '24.10.4'
        type: string
      target_combo:
        description: '选择目标架构与子架构组合'
        required: true
        default: 'qualcommax:ipq807x'
        type: choice
        options:
          - qualcommax:ipq807x
          - qualcommax:ipq50xx
          - qualcommax:ipq60xx
          - airoha:an7581
          - airoha:an7583
          - mediatek:filogic
          - armsr:armv8
          - armsr:armv7
          - ramips:mt7621
          - x86:64
      gcc_version:
        description: 'GCC 版本 (通常保持默认)'
        required: true
        default: '13.3.0'
        type: string
      target_packages:
        description: '要编译的包名 (空格分隔，留空则自动扫描 printing 库所有包)'
        required: false
        default: ''
        type: string

jobs:
  build:
      runs-on: ubuntu-22.04

      steps:
        - name: 检出代码 (Checkout)
          uses: actions/checkout@v4

        - name: 初始化并补全编译环境依赖
          run: |
            sudo apt update -y
            sudo apt install -y --no-install-recommends \
                build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk \
                git gettext libssl-dev xsltproc wget unzip libelf-dev \
                python3-distutils python3-setuptools python3-dev zstd rsync ca-certificates file \
                time diffutils subversion mercurial patchelf libgmp-dev libmpc-dev libmpfr-dev

        - name: 解析架构并下载解压 SDK
          env:
            IMMORTALWRT_VERSION: ${{ inputs.immortalwrt_version }}
            TARGET_COMBO: ${{ inputs.target_combo }}
            GCC_VERSION: ${{ inputs.gcc_version }}
            LIBC: 'musl'
          run: |
            # 自动拆分组合，例如 qualcommax:ipq807x 拆分为 ARCH=qualcommax, SUBTARGET=ipq807x
            TARGET_ARCH="${TARGET_COMBO%%:*}"
            TARGET_SUBTARGET="${TARGET_COMBO#*:}"
            
            echo "TARGET_ARCH=${TARGET_ARCH}" >> $GITHUB_ENV
            echo "TARGET_SUBTARGET=${TARGET_SUBTARGET}" >> $GITHUB_ENV
            echo "当前选择的目标架构: ${TARGET_ARCH}, 子架构: ${TARGET_SUBTARGET}"

            WORKDIR="$(pwd)/immortalwrt_build"
            sdk_tarname="immortalwrt-sdk-${IMMORTALWRT_VERSION}-${TARGET_ARCH}-${TARGET_SUBTARGET}_gcc-${GCC_VERSION}_${LIBC}.Linux-x86_64.tar.zst"
            sdk_url="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET_ARCH}/${TARGET_SUBTARGET}/${sdk_tarname}"

            mkdir -p "$WORKDIR"
            echo "下载 SDK: ${sdk_url}"
            wget -P "$WORKDIR" "$sdk_url" || {
                echo "警告：从正式 releases 下载失败，尝试从 snapshots 或通用路径查找，或请检查版本兼容性"
                exit 1
            }

            echo "解压 SDK..."
            tar --zstd -xf "${WORKDIR}/${sdk_tarname}" -C "$WORKDIR"
            
            SDK_DIR=$(find "$WORKDIR" -maxdepth 1 -type d -name "immortalwrt-sdk-*" | head -n1)
            echo "SDK_DIR=${SDK_DIR}" >> $GITHUB_ENV
            echo "SDK 目录：${SDK_DIR}"

        - name: 添加第三方 Feed 并配置
          env:
            CUSTOM_FEED_REPO: "https://github.com/TW20022/openwrt-24-printing-pack.git"
            CUSTOM_FEED_NAME: "printing"
            TARGET_PACKAGES_INPUT: "${{ inputs.target_packages }}"
          run: |
            cd "${{ env.SDK_DIR }}"
            echo "添加第三方 feed：${CUSTOM_FEED_REPO}"
            echo "src-git ${CUSTOM_FEED_NAME} ${CUSTOM_FEED_REPO}" >> feeds.conf.default

            echo "更新 feeds..."
            ./scripts/feeds update -a
            ./scripts/feeds install -a

            if [ -z "${TARGET_PACKAGES_INPUT}" ]; then
                echo "未指定 TARGET_PACKAGES，自动扫描 ${CUSTOM_FEED_NAME} feed 下的所有包..."
                mapfile -t TARGET_PACKAGES < <(./scripts/feeds list -r "${CUSTOM_FEED_NAME}" | awk '{print $1}')
            else
                read -ra TARGET_PACKAGES <<< "${TARGET_PACKAGES_INPUT}"
            fi

            echo "将对以下包进行配置编译：${TARGET_PACKAGES[*]}"
            echo "TARGET_PACKAGES_LIST=${TARGET_PACKAGES[*]}" >> $GITHUB_ENV

            make defconfig

            for pkg in "${TARGET_PACKAGES[@]}"; do
                echo "  选中包：${pkg}"
                ./scripts/config --set "CONFIG_PACKAGE_${pkg}=m"
            done

            make defconfig

        - name: 下载源码与并行编译
          run: |
            cd "${{ env.SDK_DIR }}"
            JOBS=$(nproc)
            
            echo "开始下载依赖源码..."
            make download V=s -j"${JOBS}" || make download V=s -j"${JOBS}"

            for pkg in ${TARGET_PACKAGES_LIST}; do
                echo "==================== 编译 ${pkg} ===================="
                make "package/${pkg}/compile" V=s -j"${JOBS}"
            done

        - name: 收集编译产物 (.ipk)
          run: |
            cd "${{ env.SDK_DIR }}"
            mkdir -p "${GITHUB_WORKSPACE}/ipk_output"
            find bin/packages -type f -name "*.ipk" -exec cp -v {} "${GITHUB_WORKSPACE}/ipk_output/" \;

        - name: 上传 IPK 构件 (Artifacts)
          uses: actions/upload-artifact@v4
          with:
            name: immortalwrt-ipk-${{ env.TARGET_ARCH }}-${{ env.TARGET_SUBTARGET }}
            path: ipk_output/*.ipk
