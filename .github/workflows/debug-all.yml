name: Build ImmortalWrt IPK
on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Target Arch"
        type: choice
        required: true
        default: qualcommax
        options:
          - qualcommax
          - airoha
          - mediatek
          - armsr
          - ramips
          - x86
      target_subtarget:
        description: "SubTarget (需要和Arch匹配，x86填64)"
        type: choice
        required: true
        default: ipq807x
        options:
          - ipq807x
          - ipq50xx
          - ipq60xx
          - an7581
          - an7583
          - filogic
          - armv8
          - armv7
          - mt7621
          - 64
      immortalwrt_version:
        description: "ImmortalWrt版本"
        required: true
        default: "24.10.4"
        type: string
      gcc_version:
        description: "GCC版本"
        required: true
        default: "13.3.0"
        type: string
      libc:
        description: "libc"
        required: true
        default: "musl"
        type: choice
        options:
          - musl
          - glibc
      custom_feed_repo:
        description: "自定义feed仓库git地址"
        required: true
        default: "https://github.com/TW20022/openwrt-24-printing-packages.git"
        type: string
      custom_feed_name:
        description: "feed名称"
        required: true
        default: "printing"
        type: string
      target_packages_str:
        description: "待编译包，空格分隔；留空=编译feed全部包"
        required: false
        default: ""
        type: string
      max_jobs:
        description: "编译并发数(建议2-4，免费runner最大4)"
        required: true
        default: "4"
        type: string
      override_official_pkgs:
        description: "是否覆盖官方同名包"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET_COMBO: ${{ github.event.inputs.target_arch }}:${{ github.event.inputs.target_subtarget }}
      IMMORTALWRT_VERSION: ${{ github.event.inputs.immortalwrt_version }}
      GCC_VERSION: ${{ github.event.inputs.gcc_version }}
      LIBC: ${{ github.event.inputs.libc }}
      CUSTOM_FEED_REPO: ${{ github.event.inputs.custom_feed_repo }}
      CUSTOM_FEED_NAME: ${{ github.event.inputs.custom_feed_name }}
      TARGET_PACKAGES_STR: ${{ github.event.inputs.target_packages_str }}
      MAX_JOBS: ${{ github.event.inputs.max_jobs }}
      OVERRIDE_OFFICIAL: ${{ github.event.inputs.override_official_pkgs }}
      CI: "true"
      WORKDIR: ${{ github.workspace }}/immortalwrt_build
      OUTPUT_DIR: ${{ github.workspace }}/ipk_output
      LOG_DIR: ${{ github.workspace }}/immortalwrt_build/build_logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip libelf-dev \
            python3 python3-setuptools python3-dev perl zstd rsync ca-certificates file time diffutils subversion mercurial \
            patchelf libgmp-dev libmpc-dev libxml2-utils libmpfr-dev libsane-dev libsnmp-dev ghostscript
          # 全局配置git安全目录，避免feeds拉取报错
          git config --global --add safe.directory '*'

      - name: Cache SDK tarball & sources
        uses: actions/cache@v4
        with:
          path: |
            ./immortalwrt_build/*.tar.zst
            ./immortalwrt_build/dl
          # 缓存key包含所有版本参数，避免错用
          key: ${{ env.IMMORTALWRT_VERSION }}-${{ env.TARGET_COMBO }}-gcc-${{ env.GCC_VERSION }}-${{ env.LIBC }}-sdk-dl-v2

      - name: Build IPK with ImmortalWrt SDK
        run: |
          set -euo pipefail

          # 校验MAX_JOBS为正整数
          if ! [[ "${MAX_JOBS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_jobs必须为正整数，当前值: ${MAX_JOBS}"
            exit 1
          fi

          # 解析架构和子目标
          TARGET_ARCH="${TARGET_COMBO%%:*}"
          TARGET_SUBTARGET="${TARGET_COMBO#*:}"
          if [[ "${TARGET_ARCH}" == "${TARGET_SUBTARGET}" ]]; then
            echo "::error::TARGET_COMBO格式错误: ${TARGET_COMBO}，应为arch:subtarget格式"
            exit 1
          fi

          # 校验架构与子目标匹配
          declare -A VALID_SUBTARGETS=(
            [qualcommax]="ipq807x ipq50xx ipq60xx"
            [airoha]="an7581 an7583"
            [mediatek]="filogic"
            [armsr]="armv8 armv7"
            [ramips]="mt7621"
            [x86]="64"
          )
          if [[ ! " ${VALID_SUBTARGETS[${TARGET_ARCH}]:-} " =~ " ${TARGET_SUBTARGET} " ]]; then
            echo "::error::子目标 ${TARGET_SUBTARGET} 不属于架构 ${TARGET_ARCH}，合法子目标: ${VALID_SUBTARGETS[${TARGET_ARCH}]:-无}"
            exit 1
          fi

          echo "✅ 目标架构: ${TARGET_ARCH}/${TARGET_SUBTARGET}"
          echo "✅ ImmortalWrt版本: ${IMMORTALWRT_VERSION}"
          echo "✅ GCC版本: ${GCC_VERSION}，libc: ${LIBC}"

          # 导出artifact后缀给后续步骤使用，避免YAML表达式问题
          echo "ARTIFACT_SUFFIX=${TARGET_ARCH}-${TARGET_SUBTARGET}" >> "$GITHUB_ENV"

          SDK_DIR="${WORKDIR}/sdk-${TARGET_ARCH}-${TARGET_SUBTARGET}"
          mkdir -p "${WORKDIR}" "${LOG_DIR}" "${OUTPUT_DIR}"

          # 下载SDK
          sdk_tarname="immortalwrt-sdk-${IMMORTALWRT_VERSION}-${TARGET_ARCH}-${TARGET_SUBTARGET}_gcc-${GCC_VERSION}_${LIBC}.Linux-x86_64.tar.zst"
          sdk_url="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET_ARCH}/${TARGET_SUBTARGET}/${sdk_tarname}"

          if [[ ! -f "${WORKDIR}/${sdk_tarname}" ]]; then
            echo "[INFO] 下载SDK: ${sdk_url}"
            wget --tries=5 --timeout=60 --dns-timeout=10 --no-verbose -P "${WORKDIR}" "${sdk_url}" || {
              echo "::error::SDK下载失败，请检查版本号、架构和子目标是否正确"
              exit 1
            }
          else
            echo "[INFO] 复用缓存SDK: ${sdk_tarname}"
          fi

          # 校验SDK完整性（SDK最小约10MB，小于则为错误页面）
          tar_size=$(stat -c%s "${WORKDIR}/${sdk_tarname}")
          if [[ $tar_size -lt 10000000 ]]; then
            echo "::error::SDK文件大小仅${tar_size}字节，已损坏或下载到错误页面"
            rm -f "${WORKDIR}/${sdk_tarname}"
            exit 1
          fi

          # 解压SDK
          if [[ ! -d "${SDK_DIR}" ]]; then
            echo "[INFO] 解压SDK..."
            temp_extract_dir="${WORKDIR}/temp_extract_${RANDOM}"
            mkdir -p "${temp_extract_dir}"
            if tar --zstd -xf "${WORKDIR}/${sdk_tarname}" -C "${temp_extract_dir}" 2>/dev/null; then
              :
            else
              tar -I zstd -xf "${WORKDIR}/${sdk_tarname}" -C "${temp_extract_dir}" || {
                echo "::error::SDK解压失败"
                exit 1
              }
            fi

            shopt -s nullglob
            extracted_files=( "${temp_extract_dir}"/* )
            shopt -u nullglob

            if [[ ${#extracted_files[@]} -ne 1 ]]; then
              echo "::error::SDK解压后文件数量异常: ${#extracted_files[@]}"
              exit 1
            fi
            extracted_name=$(basename "${extracted_files[0]}")
            mv "${temp_extract_dir}/${extracted_name}" "${SDK_DIR}"
            rm -rf "${temp_extract_dir}"
            echo "[INFO] SDK解压完成: ${SDK_DIR}"
          else
            echo "[INFO] 复用已解压SDK: ${SDK_DIR}"
          fi

          cd "${SDK_DIR}" || {
            echo "::error::进入SDK目录失败"
            exit 1
          }

          # 配置dl目录符号链接（复用缓存，不要删staging_dir！SDK预编译工具都在里面）
          mkdir -p "${WORKDIR}/dl"
          rm -rf "${SDK_DIR}/dl"
          ln -s "${WORKDIR}/dl" "${SDK_DIR}/dl"
          echo "[INFO] dl目录已链接到缓存"

          # 确定feeds配置文件
          FEEDS_CONF=""
          if [[ -f "feeds.conf" ]]; then
            FEEDS_CONF="feeds.conf"
          elif [[ -f "feeds.conf.default" ]]; then
            FEEDS_CONF="feeds.conf.default"
          else
            echo "::error::未找到feeds配置文件"
            exit 1
          fi
          echo "[INFO] 使用feeds配置: ${FEEDS_CONF}"

          # 添加自定义feed，避免重复添加
          if ! grep -E "^src-git[[:space:]]+${CUSTOM_FEED_NAME}[[:space:]]" "${FEEDS_CONF}"; then
            echo "[INFO] 添加自定义feed: ${CUSTOM_FEED_NAME} -> ${CUSTOM_FEED_REPO}"
            echo "src-git ${CUSTOM_FEED_NAME} ${CUSTOM_FEED_REPO}" >> "${FEEDS_CONF}"
          fi

          # 更新所有feed
          echo "[INFO] 更新feeds..."
          ./scripts/feeds update -a > "${LOG_DIR}/feeds_update.log" 2>&1 || {
            echo "::error::feeds更新失败，查看日志: ${LOG_DIR}/feeds_update.log"
            exit 1
          }

          # 如果需要覆盖官方包，先删除官方同名包
          if [[ "${OVERRIDE_OFFICIAL}" == "true" ]]; then
            echo "[INFO] 移除官方源中可能冲突的包..."
            rm -rf feeds/packages/utils/hplip 2>/dev/null || true
            rm -rf feeds/packages/utils/gutenprint 2>/dev/null || true
            rm -rf feeds/packages/utils/cups 2>/dev/null || true
          fi

          # 解析待编译包列表
          read -ra TARGET_PACKAGES <<< "${TARGET_PACKAGES_STR}"
          if [[ ${#TARGET_PACKAGES[@]} -eq 0 ]]; then
            echo "[INFO] 未指定包列表，编译 ${CUSTOM_FEED_NAME} feed下所有包"
            # 过滤掉TARGET:开头的行（feeds list会输出target信息）
            mapfile -t TARGET_PACKAGES < <(./scripts/feeds list -r "${CUSTOM_FEED_NAME}" | awk '$1!="TARGET:" && NF {print $1}')
            if [[ ${#TARGET_PACKAGES[@]} -eq 0 ]]; then
              echo "::error::feeds list返回0个包，请检查feed地址是否正确"
              exit 1
            fi
          fi
          echo "[INFO] 待编译包总数: ${#TARGET_PACKAGES[@]}"
          for p in "${TARGET_PACKAGES[@]}"; do echo "  - $p"; done

          # 安装feed包
          echo "[INFO] 安装feed包..."
          if [[ "${OVERRIDE_OFFICIAL}" == "true" ]]; then
            FORCE_PARAM="-f"
          else
            FORCE_PARAM=""
          fi
          if [[ ${#TARGET_PACKAGES[@]} -gt 0 && -n "${TARGET_PACKAGES_STR}" ]]; then
            # 安装指定包
            # shellcheck disable=SC2086
            ./scripts/feeds install -p "${CUSTOM_FEED_NAME}" ${FORCE_PARAM} "${TARGET_PACKAGES[@]}" > "${LOG_DIR}/feeds_install.log" 2>&1 || {
              echo "::error::feeds安装失败，查看日志: ${LOG_DIR}/feeds_install.log"
              exit 1
            }
          else
            # 安装自定义feed所有包
            # shellcheck disable=SC2086
            ./scripts/feeds install -p "${CUSTOM_FEED_NAME}" -a ${FORCE_PARAM} > "${LOG_DIR}/feeds_install.log" 2>&1 || {
              echo "::error::feeds安装失败，查看日志: ${LOG_DIR}/feeds_install.log"
              exit 1
            }
          fi

          # 清空旧编译产物（绝对不能make dirclean！会删掉SDK预编译好的toolchain）
          rm -rf bin build_dir/target-*
          mkdir -p bin

          # 生成默认配置
          echo "[INFO] 生成默认配置..."
          make defconfig > "${LOG_DIR}/defconfig1.log" 2>&1

          # 写入所有目标包到.config
          for pkg in "${TARGET_PACKAGES[@]}"; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=" .config; then
              sed -i "s|^CONFIG_PACKAGE_${pkg}=.*|CONFIG_PACKAGE_${pkg}=m|" .config
            else
              echo "CONFIG_PACKAGE_${pkg}=m" >> .config
            fi
          done

          # 自动处理所有依赖，全部选m，避免defconfig清掉目标包
          echo "[INFO] 自动配置依赖..."
          yes "m" | make oldconfig > "${LOG_DIR}/oldconfig.log" 2>&1
          # 再次生成配置确保一致性
          make defconfig > "${LOG_DIR}/defconfig2.log" 2>&1

          # 检查包配置是否生效
          warn_cnt=0
          for pkg in "${TARGET_PACKAGES[@]}"; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=m" .config; then
              echo "[WARN] 包 ${pkg} 未能启用（可能缺失依赖），将跳过编译"
              warn_cnt=$((warn_cnt + 1))
            fi
          done
          if (( warn_cnt > 0 )); then
            echo "::warning::${warn_cnt}个包因依赖缺失无法启用，将跳过"
          fi

          # 下载所有源码
          echo "[INFO] 下载源码包，并发数: ${MAX_JOBS}"
          if ! make download V=s -j"${MAX_JOBS}" > "${LOG_DIR}/download.log" 2>&1; then
            echo "[WARN] 第一次下载失败，重试一次..."
            if ! make download V=s -j"${MAX_JOBS}" > "${LOG_DIR}/download_retry.log" 2>&1; then
              echo "::error::源码下载失败，查看日志: ${LOG_DIR}/download.log"
              exit 1
            fi
            echo "[INFO] 重试下载成功"
          fi

          # ========== 核心：SDK编译流程 ==========
          # 注意：SDK已经预编译好所有tools和toolchain，绝对不要执行make tools/install或make toolchain/install！
          # -k参数：单包失败不中断，继续编译其他包，满足"单包失败job不失败"的需求
          # make会自动处理包依赖顺序，包括host端包编译（解决gutenprint host脚本找不到的问题）
          echo "[INFO] 开始编译所有选中的包，并发数: ${MAX_JOBS}"
          make -k -j"${MAX_JOBS}" V=s 2>&1 | tee "${LOG_DIR}/build.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          # 收集生成的IPK
          echo "[INFO] 收集生成的IPK文件..."
          mkdir -p "${OUTPUT_DIR}"
          find "${OUTPUT_DIR}" -mindepth 1 -delete
          success_list=()
          failed_list=()

          # 遍历目标包，检查是否生成了ipk（比日志判断更准确）
          for pkg in "${TARGET_PACKAGES[@]}"; do
            # 查找对应包的ipk（ipk命名格式：<pkgname>_<version>_<arch>.ipk）
            ipk_file=$(find bin/packages -type f -name "${pkg}_*.ipk" 2>/dev/null | head -n1)
            if [[ -n "${ipk_file}" && -f "${ipk_file}" ]]; then
              cp "${ipk_file}" "${OUTPUT_DIR}/"
              success_list+=("${pkg}")
            else
              failed_list+=("${pkg}")
            fi
          done

          # 复制其他自定义feed生成的依赖包（可选，注释掉则只留目标包）
          # find bin/packages -path "*/${CUSTOM_FEED_NAME}/*" -name "*.ipk" -exec cp -n {} "${OUTPUT_DIR}/" \;

          echo ""
          echo "===== 编译结果汇总 ====="
          echo "目标: ${TARGET_COMBO}"
          echo "ImmortalWrt版本: ${IMMORTALWRT_VERSION}"
          echo "总待编译包: ${#TARGET_PACKAGES[@]}"
          echo "成功: ${#success_list[@]}"
          echo "失败: ${#failed_list[@]}"
          echo ""
          echo "成功包列表:"
          for p in "${success_list[@]}"; do echo "  ✅ $p"; done
          echo ""
          echo "失败包列表:"
          for p in "${failed_list[@]}"; do echo "  ❌ $p"; done

          # 生成构建报告（注意在清空OUTPUT_DIR之后写入，避免被删）
          report_file="${OUTPUT_DIR}/build_report.txt"
          {
            echo "ImmortalWrt IPK Build Report"
            echo "============================"
            echo "Build Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "ImmortalWrt Version: ${IMMORTALWRT_VERSION}"
            echo "GCC Version: ${GCC_VERSION}"
            echo "libc: ${LIBC}"
            echo "Target: ${TARGET_COMBO}"
            echo "Total Packages: ${#TARGET_PACKAGES[@]}"
            echo "Success: ${#success_list[@]}"
            echo "Failed: ${#failed_list[@]}"
            echo ""
            echo "Success Packages:"
            for p in "${success_list[@]}"; do echo "  - $p"; done
            echo ""
            echo "Failed Packages:"
            for p in "${failed_list[@]}"; do echo "  - $p"; done
            echo ""
            echo "IPK Files:"
            ls -1 "${OUTPUT_DIR}"/*.ipk 2>/dev/null || echo "  (no ipk files)"
          } > "${report_file}"

          echo ""
          echo "[INFO] IPK输出目录: ${OUTPUT_DIR}"
          ls -lh "${OUTPUT_DIR}/"

          # 存在失败包仅警告，job不标红
          if [[ ${#failed_list[@]} -gt 0 ]]; then
            echo "::warning::${#failed_list[@]}个包编译失败，请查看构建日志和报告"
            # 如果需要有失败包就标红job，取消下面注释
            # exit 1
          fi

          exit 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.LOG_DIR }}
          retention-days: 14

      - name: Upload ipk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 14
