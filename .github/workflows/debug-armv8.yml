name: Build armv8 sdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev gawk flex git gettext libssl-dev xsltproc zlib1g-dev ecj libelf-dev wget unzip python3 python3-pip python3-setuptools python3-wheel python3-distutils zstd

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/releases/24.10.8/targets/armsr/armv8/openwrt-sdk-24.10.8-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-24.10.8-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-24.10.8-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk

    - name: Configure feeds and target
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        echo "src-git printing https://github.com/master-0123/openwrt-printing-packages.git" >> feeds.conf
        ./scripts/feeds update -a 
        ./scripts/feeds install -a

        # 精简 .config
        cat > .config <<'EOF'
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv8=y
        CONFIG_TARGET_armsr_armv8_Generic=y
        CONFIG_PACKAGE_gutenprint=y
        EOF

        make defconfig >/dev/null

    - name: Show printing feed packages
      run: |
        cd openwrt-sdk
        echo "=== Printing feed packages ==="
        ls -1 package/feeds/printing

    - name: Build printing packages (auto scan)
      run: |
        cd openwrt-sdk
        echo "=== Start building printing packages ==="
        make package/gutenprint/compile -j1 V=sc
        echo "=== Build finished ==="

    - name: List generated IPK files
      run: |
        cd openwrt-sdk
        echo "=== Printing IPK files ==="
        find bin/packages -type f -name "*.ipk"

    - name: Upload all IPK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-ipk
        path: openwrt-sdk/bin/packages/**/*.ipk
