name: Build OpenWrt Printing Packages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk flex git wget unzip python3 python3-pip python3-setuptools python3-wheel zstd \
            libncurses5-dev libncursesw5-dev \
            zlib1g-dev gettext libssl-dev xsltproc rsync bc groff dc \
            libcups2-dev libcupsimage2-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libfontconfig1-dev libfreetype6-dev \
            liblcms2-dev libjbig-dev \
            libtool automake autoconf perl pkg-config \
            enscript poppler-utils libpaper-dev
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

      - name: Clone OpenWrt Source (v24.10.5)
        run: |
          git clone --branch v24.10.5 --depth 1 https://git.openwrt.org/openwrt/openwrt.git openwrt-source
          cd openwrt-source
          
          # 引入本地仓库作为 printing feed
          echo "src-link printing ${{ github.workspace }}" >> feeds.conf.default
          
          # -f 参数强制覆盖已有源，避免 pull 冲突
          ./scripts/feeds update -a -f
          ./scripts/feeds install -a

      - name: Configure Target and Packages
        run: |
          cd openwrt-source
          
          # 1. 初始化配置
          make defconfig
          
          # 2. 设置 Target 为 ramips / mt7621
          ./scripts/config --set-val TARGET_ramips y
          ./scripts/config --set-val TARGET_ramips_mt7621 y
          ./scripts/config --set-val TARGET_ROOTFS_TARGZ y

          # 3. 启用 printing 相关包及其核心依赖（以模块 m 形式编译生成 ipk）
          for pkg in \
            dbus cairo lcms2 libjbigkit libpng libjpeg-turbo zlib \
            cups libcups libcupsimage libppd libcupsfilters \
            poppler qpdf ghostscript ghostscript-fonts-std \
            foomatic-filters openprinting-cups-filters \
            gutenprint splix foo2zjs foo2zjs-extra; do
            ./scripts/config --enable-package-$pkg 2>/dev/null || ./scripts/config --set-m PACKAGE_$pkg || true
          done

          # 4. 自动补全依赖树
          make defconfig

      - name: Build Printing Packages Only
        run: |
          cd openwrt-source
          JOBS=$(nproc)
          echo ">>> Using parallel jobs: $JOBS"
          
          # 仅编译 IPK 包。使用 V=e 保持精简日志（保留必要的错误提示，去掉了 1>/dev/null 避免无法排错）
          make package/compile V=e -j$JOBS || make package/compile V=e -j1

      - name: Collect IPK Artifacts
        run: |
          mkdir -p printing-ipks
          # 收集所有编译生成的 ipk 文件（包含打印包及其编译好的依赖）
          find openwrt-source/bin/packages -name "*.ipk" -exec cp {} printing-ipks/ \;
          ls -la printing-ipks/

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-printing-ipks
          path: printing-ipks/*.ipk
      - name: Apply Compatibility Fixes
        run: |
          cd openwrt-sdk
          # libjbigkit: 去掉 -ansi/-pedantic
          if [ -d "package/feeds/printing/libjbigkit" ]; then
            find package/feeds/printing/libjbigkit/ -type f -name "Makefile" -exec sed -i 's/-ansi//g; s/-pedantic//g' {} +
          fi
          # Ghostscript: GCC13 容错
          if [ -d "package/feeds/printing/ghostscript" ]; then
            sed -i 's/HOST_CONFIGURE_ARGS:=/HOST_CONFIGURE_ARGS:= HOST_CFLAGS="-Wno-error -Wno-implicit-function-declaration" /g' package/feeds/printing/ghostscript/Makefile
          fi
          # foomatic-filters: 注入 TEXTTOPS
          if [ -d "package/feeds/printing/foomatic-filters" ]; then
            sed -i 's/CONFIGURE_ARGS+=/CONFIGURE_ARGS+= TEXTTOPS=\/usr\/bin\/enscript /g' package/feeds/printing/foomatic-filters/Makefile
          fi
          # gutenprint: malloc/realloc 检测补丁
          if [ -d "package/feeds/printing/gutenprint" ]; then
            sed -i 's/CONFIGURE_ARGS+=/CONFIGURE_ARGS+= ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes /g' package/feeds/printing/gutenprint/Makefile
          fi
          
      - name: Build Printing Packages in SDK
        run: |
          cd openwrt-sdk
          JOBS=$(nproc)
          echo ">>> Using max parallel jobs: $JOBS"
          
          # 1. 只强制更新自定义的 printing feed，避免官方 base 产生 git detached pull 冲突
          echo ">>> Updating printing feed..."
          ./scripts/feeds update printing
          
          # 2. 安装 feeds（确保 printing 中的包链接到 package 目录）
          ./scripts/feeds install -a
          
          # 3. 在 SDK 环境下并行编译所有已选中的 printing/应用包
          if make package/compile V=s -j$JOBS; then
            echo ">>> All packages built successfully!"
          else
            echo "!!! Multi-core build failed, retrying with single-thread (-j1)..."
            make package/compile V=sc -j1
          fi

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-printing-packages
          path: openwrt-sdk/bin/packages/**/*.ipk
