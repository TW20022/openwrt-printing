name: Build Printing Packages (MT7621 SDK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # 1. 补充 Ubuntu 宿主机编译 host 语言/图像工具(ghostscript host)所需的开发库
        sudo apt-get install -y build-essential gawk flex git wget unzip python3 python3-pip python3-setuptools python3-wheel zstd libcups2-dev libfontconfig1-dev libjpeg-dev libpng-dev zlib1g-dev liblcms2-dev

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt7621/openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk

    - name: Configure feeds and target
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf

        # 引入包含你所需文件的 master-0123 第三方打印源
        echo "src-git printing https://github.com/master-0123/openwrt-printing-packages.git" >> feeds.conf

        ./scripts/feeds update -a
        ./scripts/feeds install -a -p printing

        cat > .config <<'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_sanji_ra-x3000qy=y
        EOF

        make defconfig >/dev/null

    - name: Fix Ghostscript Host CFLAGS (Fix GCC 13 build break)
      run: |
        cd openwrt-sdk
        # 如果仓库里存在 ghostscript，注入 -Wno-error 容错参数，防止 GCC 13 将老代码警告当错误拦截
        if [ -d "package/feeds/printing/ghostscript" ]; then
          sed -i 's/HOST_CONFIGURE_ARGS:=/HOST_CONFIGURE_ARGS:= CFLAGS="-Wno-error -Wno-implicit-function-declaration" /g' package/feeds/printing/ghostscript/Makefile || true
        fi

    - name: Build target printing packages
      run: |
        cd openwrt-sdk
        echo "=== Start building target packages ==="

        # 按依赖顺序编译你需要的 4 个包（加上 libjbigkit 共 5 个）
        TARGET_PACKAGES="libjbigkit foomatic-filters foo2zjs foo2zjs-extra gutenprint"

        for pkg in $TARGET_PACKAGES; do
          echo ">>> [Building] $pkg ..."
          # 先并行编译，如果报错自动降级为单线程 -j1 V=s 打印精确报错，且不打断后续包编译
          make package/feeds/printing/$pkg/compile -j$(nproc) || make package/feeds/printing/$pkg/compile -j1 V=s || echo "!!! [Failed] $pkg failed"
        done

        echo "=== Build finished ==="

    - name: List generated IPK files
      run: |
        cd openwrt-sdk
        echo "=== Printing IPK files ==="
        mkdir -p bin/packages
        find bin/packages -type f -name "*.ipk"

    - name: Upload IPK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: printing-ipk-mt7621
        path: openwrt-sdk/bin/packages/**/*.ipk
        if-no-files-found: warn
