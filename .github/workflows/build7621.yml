name: Build All Printing Packages (MT7621 SDK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        # 基础编译工具 + 打印栈依赖
        sudo apt-get install -y build-essential gawk flex git wget unzip python3 python3-pip python3-setuptools python3-wheel zstd \
          libcups2-dev libfontconfig1-dev libjpeg-dev libpng-dev zlib1g-dev liblcms2-dev libtiff-dev libfreetype6-dev \
          enscript a2ps bc dc poppler-utils \
          libpaper-dev pkg-config perl

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt7621/openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk
        rm -f *.zst

    - name: Configure feeds and target
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        echo "src-git printing https://github.com/master-0123/openwrt-printing-packages.git" >> feeds.conf

        ./scripts/feeds update -a
        ./scripts/feeds install -a -p printing

        cat > .config <<'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_sanji_ra-x3000qy=y
        EOF

        make defconfig >/dev/null

    - name: Apply Compatibility Fixes
      run: |
        cd openwrt-sdk
        # 1. libjbigkit target 硬编码修复
        mkdir -p staging_dir build_dir
        REAL_TARGET_STAGING=$(ls -d staging_dir/target-mipsel_* 2>/dev/null | head -n 1)
        REAL_TARGET_BUILD=$(ls -d build_dir/target-mipsel_* 2>/dev/null | head -n 1)
        
        if [ -n "$REAL_TARGET_STAGING" ]; then
          mkdir -p "$REAL_TARGET_STAGING/usr/lib" "$REAL_TARGET_STAGING/usr/include"
          [ ! -e staging_dir/target-mipsel_24kc_musl ] && ln -sf $(basename "$REAL_TARGET_STAGING") staging_dir/target-mipsel_24kc_musl
        fi
        if [ -n "$REAL_TARGET_BUILD" ]; then
          [ ! -e build_dir/target-mipsel_24kc_musl ] && ln -sf $(basename "$REAL_TARGET_BUILD") build_dir/target-mipsel_24kc_musl
        fi

        # 2. 修复 libjbigkit 在 GCC 13 下的 -ansi/-pedantic 严格模式拦截 (重点修复)
        if [ -d "package/feeds/printing/libjbigkit" ]; then
          echo "Applying fix for libjbigkit C flags..."
          find package/feeds/printing/libjbigkit/ -type f \( -name "Makefile" -o -name "*.patch" \) -exec sed -i 's/-ansi//g; s/-pedantic//g' {} + || true
        fi

        # 3. Ghostscript GCC 13 容错补丁
        if [ -d "package/feeds/printing/ghostscript" ]; then
          sed -i 's/HOST_CONFIGURE_ARGS:=/HOST_CONFIGURE_ARGS:= HOST_CFLAGS="-Wno-error -Wno-implicit-function-declaration" /g' package/feeds/printing/ghostscript/Makefile || true
        fi

        # 4. foomatic-filters 注入 TEXTTOPS
        if [ -d "package/feeds/printing/foomatic-filters" ]; then
          sed -i 's/CONFIGURE_ARGS+=/CONFIGURE_ARGS+= TEXTTOPS=\/usr\/bin\/enscript /g' package/feeds/printing/foomatic-filters/Makefile || true
        fi

        # 5. gutenprint 交叉编译检测补丁
        if [ -d "package/feeds/printing/gutenprint" ]; then
          sed -i 's/CONFIGURE_ARGS+=/CONFIGURE_ARGS+= ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes /g' package/feeds/printing/gutenprint/Makefile || true
        fi

    - name: Build target printing packages
      run: |
        cd openwrt-sdk
        echo "=== Start building target packages ==="

        TARGET_PACKAGES="libjbigkit lcms2 qpdf avahi cups cairo poppler ghostscript libcupsfilters libppd openprinting-cups-filters foomatic-filters foo2zjs foo2zjs-extra gutenprint ghostscript-fonts-std"

        SUCCESS_LIST=""
        FAILED_LIST=""

        # 强制忽略警告报错的全局 Flag，并限制适度并发以防 Runner 内存溢出导致终止
        BUILD_FLAGS='EXTRA_CFLAGS="-Wno-error -Wno-unused-result" BUILD_KEY=1'

        for pkg in $TARGET_PACKAGES; do
          echo "=================================================="
          echo ">>> [Building] $pkg ..."
          echo "=================================================="
          
          if eval make package/feeds/printing/$pkg/compile $BUILD_FLAGS -j2 || eval make package/feeds/printing/$pkg/compile $BUILD_FLAGS -j1 V=s; then
            echo ">>> [Success] $pkg"
            SUCCESS_LIST="$SUCCESS_LIST $pkg"
          else
            echo "!!! [Failed] $pkg, retrying with clean..."
            make package/feeds/printing/$pkg/clean
            if eval make package/feeds/printing/$pkg/compile $BUILD_FLAGS -j1 V=s; then
              echo ">>> [Recovered] $pkg"
              SUCCESS_LIST="$SUCCESS_LIST $pkg"
            else
              echo "!!! [Failed] $pkg after clean retry"
              FAILED_LIST="$FAILED_LIST $pkg"
              mkdir -p ../failed_logs/$pkg
              cp -r build_dir/target-*/$pkg-* ../failed_logs/$pkg/ 2>/dev/null || true
            fi
          fi
        done

        echo ""
        echo "=================================================="
        echo "              BUILD RESULTS SUMMARY               "
        echo "=================================================="
        echo -e " Successful packages:\n  ${SUCCESS_LIST:-None}"
        echo -e "\n Failed packages:\n  ${FAILED_LIST:-None}"
        echo "=================================================="

    - name: List generated IPK files
      run: |
        cd openwrt-sdk
        echo "=== Generated IPK List ==="
        mkdir -p bin/packages
        ls -R bin/packages
        find bin/packages -type f -name "*.ipk" | sort

    - name: Upload IPK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: printing-ipk-mt7621
        path: |
          openwrt-sdk/bin/packages/**/*.ipk
          openwrt-sdk/bin/targets/**/*.ipk
        if-no-files-found: warn

    - name: Upload failed logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: printing-failed-logs
        path: openwrt-sdk/../failed_logs/**
        if-no-files-found: ignore
