name: Debug Packages (X86/64 SDK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gawk flex git wget unzip python3 python3-dev python3-pip python3-setuptools python3-wheel zstd uuid-dev libuuid1 libncurses5-dev libncursesw5-dev libssl-dev libffi-dev zlib1g-dev file libtool autoconf automake pkg-config

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk

    - name: Configure feeds and target
      run: |
        cd openwrt-sdk
        cp feeds.conf.default feeds.conf
        echo "src-git printing https://github.com/hd85558/openwrt-24-printing-packages.git" >> feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 精简 .config
        cat > .config <<'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_Generic=y
        CONFIG_PACKAGE_hplip=y
        EOF

        make defconfig

    - name: Build selected printing packages (with error logs)
      run: |
        cd openwrt-sdk
        echo "=== Start building selected printing packages ==="
        make defconfig
        make package/feeds/printing/hplip/compile -j1 V=s
        echo "=== Build finished ==="

    - name: List generated IPK files
      run: |
        cd openwrt-sdk
        echo "=== Printing IPK files ==="
        find bin/packages -type f -name "*.ipk"

    - name: Upload all IPK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: selected-ipk
        path: openwrt-sdk/bin/packages/**/*.ipk
