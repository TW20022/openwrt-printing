name: Build SpliX (MT7621 SDK)

on:
  workflow_dispatch:

jobs:
  build-splix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gawk flex git wget unzip python3 python3-pip python3-setuptools python3-wheel zstd \
          libcups2-dev libjpeg-dev zlib1g-dev pkg-config

    - name: Download and extract SDK
      run: |
        wget -q https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt7621/openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -xf openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mv openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk
        rm -f *.zst

    - name: Update feeds and install base libraries
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install libcups libstdcpp zlib libjpeg-turbo jbigkit

    - name: Inject Custom SpliX Package
      run: |
        mkdir -p openwrt-sdk/package/splix
        cat << 'EOF' > openwrt-sdk/package/splix/Makefile
        include $(TOPDIR)/rules.mk

        PKG_NAME:=splix
        PKG_VERSION:=2.0.0
        PKG_RELEASE:=1

        PKG_SOURCE_PROTO:=git
        PKG_SOURCE_URL:=https://github.com/OpenPrinting/splix.git
        PKG_SOURCE_VERSION:=master
        PKG_MIRROR_HASH:=skip

        PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_VERSION)

        include $(INCLUDE_DIR)/package.mk

        define Package/splix
          SECTION:=utils
          CATEGORY:=Utilities
          SUBMENU:=Printing
          TITLE:=Samsung/Xerox SPL printer driver for CUPS
          DEPENDS:=+libcups +libstdcpp +zlib +libjpeg +jbigkit
          URL:=https://github.com/OpenPrinting/splix
        endef

        define Package/splix/description
          SpliX is a set of CUPS drivers for SPL (Samsung Printer Language) printers.
          It provides rastertoqpdl filter for Samsung ML/CLP/SCX series printers.
        endef

        MAKE_FLAGS += \
        	CUPSCONFIG="$(STAGING_DIR)/usr/bin/cups-config" \
        	OPTIM_CFLAGS="$(TARGET_CFLAGS) -Wno-error" \
        	OPTIM_CXXFLAGS="$(TARGET_CXXFLAGS) -Wno-error -std=gnu++11"

        define Package/splix/install
        	$(INSTALL_DIR) $(1)/usr/lib/cups/filter
        	$(INSTALL_BIN) $(PKG_BUILD_DIR)/splix/optimized/rastertoqpdl $(1)/usr/lib/cups/filter/
        	$(INSTALL_DIR) $(1)/usr/share/cups/model
        	$(CP) $(PKG_BUILD_DIR)/splix/ppd/* $(1)/usr/share/cups/model/ 2>/dev/null || true
        endef

        $(eval $(call BuildPackage,splix))
        EOF

    - name: Configure target
      run: |
        cd openwrt-sdk
        cat > .config <<'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_Generic=y
        CONFIG_PACKAGE_libcups=y
        CONFIG_PACKAGE_libstdcpp=y
        CONFIG_PACKAGE_jbigkit=y
        CONFIG_PACKAGE_splix=y
        EOF
        make defconfig >/dev/null

    - name: Build SpliX package
      run: |
        cd openwrt-sdk
        make package/splix/compile EXTRA_CFLAGS="-Wno-error" EXTRA_CXXFLAGS="-Wno-error" -j$(nproc) || \
        make package/splix/compile EXTRA_CFLAGS="-Wno-error" EXTRA_CXXFLAGS="-Wno-error" -j1 V=s

    - name: List generated IPK files
      run: |
        cd openwrt-sdk
        find bin/packages -type f -name "*.ipk" | sort

    - name: Upload IPK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: splix-and-depends-ipk-mt7621
        path: |
          openwrt-sdk/bin/packages/**/*.ipk
          openwrt-sdk/bin/targets/**/*.ipk
        if-no-files-found: warn
