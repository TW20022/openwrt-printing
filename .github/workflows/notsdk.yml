name: Build OpenWrt Printing Packages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk flex git wget unzip python3 python3-pip python3-setuptools python3-wheel zstd \
            libncurses5-dev libncursesw5-dev \
            zlib1g-dev gettext libssl-dev xsltproc rsync bc groff dc \
            libcups2-dev libcupsimage2-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libfontconfig1-dev libfreetype6-dev \
            liblcms2-dev libjbig-dev \
            libtool automake autoconf perl pkg-config \
            enscript poppler-utils libpaper-dev
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

      - name: Clone OpenWrt Source (v24.10.5)
        run: |
          git clone --branch v24.10.5 --depth 1 https://git.openwrt.org/openwrt/openwrt.git openwrt-source
          cd openwrt-source
          
          # 配置 Feeds（使用当前仓库作为 printing 源码）
          echo "src-link printing ${{ github.workspace }}" >> feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target and Packages
        run: |
          cd openwrt-source
          
          # 1. 加载默认配置
          make defconfig
          
          # 2. 设置目标平台为 ramips/mt7621
          sed -i 's/CONFIG_TARGET_ramips=y/CONFIG_TARGET_ramips=y/' .config
          sed -i 's/CONFIG_TARGET_ramips_mt7621=y/CONFIG_TARGET_ramips_mt7621=y/' .config
          
          # 3. 仅编译包，不打包完整固件
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          
          # 4. 显式写入所有需要的打印和依赖包配置 (使用 m 模块化编译)
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_dbus=m
          CONFIG_PACKAGE_cairo=m
          CONFIG_PACKAGE_lcms2=m
          CONFIG_PACKAGE_libjbigkit=m
          CONFIG_PACKAGE_libpng=m
          CONFIG_PACKAGE_libjpeg-turbo=m
          CONFIG_PACKAGE_zlib=m

          CONFIG_PACKAGE_cups=m
          CONFIG_PACKAGE_libcups=m
          CONFIG_PACKAGE_libcupsimage=m
          CONFIG_PACKAGE_libppd=m
          CONFIG_PACKAGE_libcupsfilters=m

          CONFIG_PACKAGE_poppler=m
          CONFIG_PACKAGE_qpdf=m

          CONFIG_PACKAGE_ghostscript=m
          CONFIG_PACKAGE_ghostscript-fonts-std=m

          CONFIG_PACKAGE_foomatic-filters=m
          CONFIG_PACKAGE_openprinting-cups-filters=m

          CONFIG_PACKAGE_gutenprint=m
          CONFIG_PACKAGE_splix=m
          CONFIG_PACKAGE_foo2zjs=m
          CONFIG_PACKAGE_foo2zjs-extra=m
          EOF
          
          make olddefconfig

      - name: Build Printing Packages Only
        run: |
          cd openwrt-source
          JOBS=$(nproc)
          echo ">>> Using parallel jobs: $JOBS"
          
          # 使用 V=e 模式，日志平时只输出错误，保持干净
          make package/compile V=e -j$JOBS || make package/compile V=e -j1

      - name: Collect IPK Artifacts
        run: |
          mkdir -p printing-ipks
          find openwrt-source/bin/packages -name "*.ipk" -exec cp {} printing-ipks/ \;
          ls -la printing-ipks/

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-printing-ipks
          path: printing-ipks/*.ipk
