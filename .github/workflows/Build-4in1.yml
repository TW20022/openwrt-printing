name: Build OpenWrt Printing Packages MT7621

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 bc groff dc \
            libcups2-dev \
            libcupsimage2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libtool \
            automake \
            autoconf

      - name: Download and extract SDK
        run: |
          wget -q https://downloads.openwrt.org/releases/24.10.5/targets/ramips/mt7621/openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar -xf openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          mv openwrt-sdk-24.10.5-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64 openwrt-sdk
          rm -f *.zst

      - name: Configure feeds and target
        run: |
          cd openwrt-sdk
          cp feeds.conf.default feeds.conf
          echo "src-git printing https://github.com/TW20022/openwrt-printing-packages.git" >> feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -a -p printing

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          EOF

          echo "CONFIG_PACKAGE_libcups=y" >> .config
          echo "CONFIG_PACKAGE_libcupsimage=y" >> .config
          echo "CONFIG_PACKAGE_libjbigkit=y" >> .config
          echo "CONFIG_PACKAGE_libpng=y" >> .config
          echo "CONFIG_PACKAGE_libjpeg-turbo=y" >> .config
          echo "CONFIG_PACKAGE_ghostscript=y" >> .config
          echo "CONFIG_PACKAGE_openprinting-cups-filters=y" >> .config
          echo "CONFIG_PACKAGE_gutenprint=y" >> .config
          echo "CONFIG_PACKAGE_splix=y" >> .config
          echo "CONFIG_PACKAGE_foo2zjs=y" >> .config
          
          make defconfig

      - name: Build Printing Packages with Strict Error Handling
        run: |
          set -e
          cd openwrt-sdk

          make V=s -j1

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-printing-packages
          path: openwrt-sdk/bin/packages/**/*.ipk
